<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Workout Picker/title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="Form Athletics home">
        <span class="brand-mark">F</span>
        <span>FORM <em>ATHLETICS</em></span>
      </a>
      <span class="status-pill"><i></i> Training engine online</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">PERSONAL TRAINING, REFINED</p>
          <h1 id="hero-title">Train with<br><span>intent.</span></h1>
          <p class="hero-description">
            Build a focused session around your goal, body area, and experience level.
            Thoughtful programming, without the noise.
          </p>

          <div class="hero-stats" aria-label="Workout library statistics">
            <div><strong>79</strong><span>Movements</span></div>
            <div><strong>09</strong><span>Body areas</span></div>
            <div><strong>02</strong><span>Skill levels</span></div>
          </div>
        </div>

        <div class="hero-art" aria-label="Athletes performing gym exercises" role="img">
          <div class="hero-art-label">
            <span>FORM / 01</span>
            <strong>MOVE WELL.<br>GET STRONG.</strong>
          </div>
        </div>
      </section>

      <section class="builder" aria-labelledby="builder-title">
        <div class="builder-heading">
          <div>
            <p class="eyebrow">BUILD YOUR SESSION</p>
            <h2 id="builder-title">What are we training?</h2>
          </div>
          <p>Three choices. One focused workout.</p>
        </div>

        <div class="controls">
          <div class="form-group">
            <label for="goal"><span>01</span> Training goal</label>
            <div class="select-wrap">
              <select id="goal">
                <option value="">Choose your goal</option>
                <option value="Strength">Build strength</option>
                <option value="muscle">Build muscle</option>
                <option value="Athletic">Move athletically</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="bodyArea"><span>02</span> Body area</label>
            <div class="select-wrap">
              <select id="bodyArea">
                <option value="">Choose a body area</option>
                <option value="Back">Back</option>
                <option value="Chest">Chest</option>
                <option value="Biceps">Biceps</option>
                <option value="Triceps">Triceps</option>
                <option value="Shoulders">Shoulders</option>
                <option value="Legs / Quadriceps">Legs / Quadriceps</option>
                <option value="Glutes">Glutes</option>
                <option value="Hamstrings">Hamstrings</option>
                <option value="Calves">Calves</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="difficulty"><span>03</span> Experience</label>
            <div class="select-wrap">
              <select id="difficulty">
                <option value="">Choose your level</option>
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
              </select>
            </div>
          </div>
        </div>

        <div class="actions">
          <button id="generateButton" type="button">
            <span class="button-label">Generate workout</span>
            <span class="button-arrow" aria-hidden="true">↗</span>
          </button>
          <button id="clearButton" type="button">Reset</button>
        </div>

        <p id="errorMessage" role="alert" aria-live="polite"></p>
      </section>

      <section id="workoutResults" class="results" aria-labelledby="results-title">
        <div class="results-heading">
          <div>
            <p class="eyebrow">YOUR PROGRAM</p>
            <h2 id="results-title">Today’s workout</h2>
          </div>
          <span class="results-note">Quality reps. Controlled tempo.</span>
        </div>

        <div id="workoutList" class="workout-grid">
          <div class="empty-state">
            <span class="empty-icon" aria-hidden="true">↗</span>
            <div>
              <strong>Your session starts here.</strong>
              <p>Select your preferences above to generate a focused workout.</p>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <span>FORM ATHLETICS © 2026</span>
      <span>Exercise imagery from the public-domain Free Exercise DB.</span>
    </footer>
  </div>

  <div id="workoutAnimation" class="workout-animation" aria-hidden="true">
    <div class="pulse-ring"></div>
    <div class="motion-mark">🏋</div>
    <span>SESSION READY</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
